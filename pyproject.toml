[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "delhivery-pallet-audit-real"
version = "0.1.0"
description = "Real-data pallet pose and SOP audit pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "torchvision>=0.19",
  "ultralytics>=8.3,<9",
  "transformers>=4.48,<6",
  "anomalib==2.6.0; python_version < '3.13'",
  "supervision>=0.26,<1",
]
dev = [
  "jsonschema>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pallet_audit"]

[tool.pytest.ini_options]
addopts = "-q -p no:langsmith -p no:anyio"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
